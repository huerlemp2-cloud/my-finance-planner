<!doctype html>
<html lang="en-GB" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="My Finance Planner — a private, offline personal finance planner for monthly budgeting, debt repayment and savings. Your data stays in your browser.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#101C2B">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>My Finance Planner</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23101C2B'/%3E%3Cpath d='M8 21l5-6 4 4 7-9' stroke='%2363CDB0' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script>
    // Apply the saved theme before first paint (dark is the default).
    try { if (localStorage.getItem('myFinancePlanner.theme') === 'light') document.documentElement.setAttribute('data-theme', 'light'); } catch (e) {}
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <noscript>
    <p style="padding:24px">My Finance Planner needs JavaScript enabled. It runs entirely in your browser and sends no data anywhere.</p>
  </noscript>

  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="brand">
        <div class="brand__mark" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16l5-6 4 4 7-9"/></svg>
        </div>
        <div class="brand__text">
          <div class="brand__name">My Finance</div>
          <div class="brand__tag">Personal planner · GBP</div>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar__footer">
        <button type="button" class="btn btn--backup btn--block" data-action="backup" title="Download a JSON backup of all your data">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>
          <span class="label">Backup data</span>
        </button>
        <button type="button" class="btn btn--ghost btn--block sidebar__collapse" data-action="toggle-sidebar" aria-label="Collapse sidebar" aria-expanded="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
          <span class="label">Collapse</span>
        </button>
      </div>
    </aside>
    <div class="scrim" data-action="close-drawer" aria-hidden="true"></div>

    <div class="main-wrap">
      <header class="topbar">
        <button type="button" class="btn btn--ghost btn--icon topbar__menu" data-action="open-drawer" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="topbar__title" id="topbar-title">Dashboard</div>
        <div class="topbar__actions">
          <div class="month-picker" id="month-picker"></div>
          <button type="button" class="btn btn--ghost btn--icon theme-toggle" data-action="toggle-theme" aria-label="Switch to light mode">
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
          <button type="button" class="btn btn--secondary hide-mobile" data-action="backup">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>
            Backup
          </button>
        </div>
      </header>

      <main id="main" tabindex="-1"></main>
    </div>

    <nav class="bottom-nav" id="bottom-nav" aria-label="Quick navigation"></nav>
  </div>

  <dialog class="dialog" id="modal" aria-labelledby="modal-title"></dialog>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>

  <script src="js/engine.js"></script>
  <script src="js/store.js"></script>
  <script src="js/sample.js"></script>
  <script src="app.js"></script>
</body>
</html>
